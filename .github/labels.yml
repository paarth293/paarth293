# GitHub issue labels for the transit system
# Sync these to all repos with: https://github.com/marketplace/actions/label-syncer

labels:
  # Signal labels (problems)
  - name: 'signal-failure'
    color: 'E0283F'
    description: '🔴 Bug: something is broken'

  - name: 'minor-delays'
    color: '8A877E'
    description: '⚠️ Performance issue or optimization needed'

  - name: 'platform-change'
    color: '161614'
    description: '🚨 Breaking change'

  # Station labels (work)
  - name: 'new-station'
    color: '2438E8'
    description: '🔵 Feature: new capability'

  - name: 'planned-works'
    color: 'F5A300'
    description: '🟠 Enhancement or refactor'

  - name: 'under-construction'
    color: 'F5A300'
    description: '🏗️ In progress, do not merge yet'

  # Community
  - name: 'good-first-ride'
    color: '1F8A4C'
    description: '✨ Good first issue for contributors'

  # Topics (for filtering repos by line)
  - name: 'line-web'
    color: '2438E8'
    description: '🔵 Web engineering line — React, Node, PostgreSQL'

  - name: 'line-ai'
    color: 'E0283F'
    description: '🔴 AI engineering line — agents, RAG, memory'

  - name: 'line-3d'
    color: 'F5A300'
    description: '🟠 3D line — Three.js, WebGL, spatial'

  - name: 'station'
    color: 'F3F1EA'
    description: '🚉 This is a station (main project)'

  - name: 'under-construction'
    color: 'F5A300'
    description: '🏗️ Station is still being built'

  # Types
  - name: 'documentation'
    color: '0366D6'
    description: '📖 Documentation or README'

  - name: 'tests'
    color: '0366D6'
    description: '✅ Tests or CI/CD'
