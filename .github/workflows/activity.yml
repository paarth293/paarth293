name: Activity skyline

on:
  schedule:
    - cron: "17 0 * * *"   # every day, 05:47 IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "fonttools>=4.40,<5"
      - name: Redraw the skyline from the real contribution calendar
        run: python .github/profile/sync_activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
      - name: Commit if it changed
        run: |
          if git diff --quiet -- assets/skyline.svg; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/skyline.svg
          git commit -m "chore: sync activity skyline [skip ci]"
          git push
