name: Rebuild profile images

# Edit any text or design in .github/profile/ and push: every image is
# regenerated from source and committed back, then the skyline is re-synced.
on:
  push:
    branches: [main]
    paths:
      - ".github/profile/**"
      - "!.github/profile/sync_activity.py"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "fonttools>=4.40,<5"
      - name: Regenerate all images
        run: python .github/profile/build_all.py
      - name: Refresh the skyline with real data
        run: python .github/profile/sync_activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- assets/; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "chore: rebuild profile images [skip ci]"
          git push
