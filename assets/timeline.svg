<svg width="900" height="130" viewBox="0 0 900 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes nodeGrow {
        from { transform:scale(0); opacity:0 }
        to   { transform:scale(1); opacity:1 }
      }
      @keyframes lineDraw { from{stroke-dashoffset:300} to{stroke-dashoffset:0} }
      @keyframes fadeLabel { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
      @keyframes glowDot {
        0%,100%{filter:drop-shadow(0 0 2px #3fb950)}
        50%{filter:drop-shadow(0 0 8px #3fb950) drop-shadow(0 0 14px #3fb95080)}
      }
      .tn1 { animation: nodeGrow 0.3s ease-out 0.3s both; transform-origin:100px 50px }
      .tn2 { animation: nodeGrow 0.3s ease-out 0.6s both; transform-origin:235px 50px }
      .tn3 { animation: nodeGrow 0.3s ease-out 0.9s both; transform-origin:370px 50px }
      .tn4 { animation: nodeGrow 0.3s ease-out 1.2s both; transform-origin:505px 50px }
      .tn5 { animation: nodeGrow 0.3s ease-out 1.5s both; transform-origin:640px 50px }
      .tn6 { animation: nodeGrow 0.3s ease-out 1.8s both; transform-origin:775px 50px }
      .tl1 { animation: lineDraw 0.4s ease-out 0.5s both; stroke-dasharray:300 }
      .tl2 { animation: lineDraw 0.4s ease-out 0.8s both; stroke-dasharray:300 }
      .tl3 { animation: lineDraw 0.4s ease-out 1.1s both; stroke-dasharray:300 }
      .tl4 { animation: lineDraw 0.4s ease-out 1.4s both; stroke-dasharray:300 }
      .tl5 { animation: lineDraw 0.4s ease-out 1.7s both; stroke-dasharray:300 }
      .tlbl { animation: fadeLabel 0.3s ease-out 2.1s both }
      .gd  { animation: glowDot 2s ease-in-out infinite }
    </style>
  </defs>

  <rect width="900" height="130" fill="#010409" rx="6"/>
  <rect x="1" y="1" width="898" height="128" fill="none" stroke="#21262d" stroke-width="1" rx="6"/>

  <!-- title -->
  <text x="30" y="22" font-family="'Courier New',monospace" font-size="10" fill="#6e7681">
    $ git log --oneline --graph --journey
  </text>

  <!-- Main timeline line -->
  <line x1="80" y1="56" x2="800" y2="56" stroke="#21262d" stroke-width="2"/>

  <!-- Connector segments (animated) -->
  <line class="tl1" x1="100" y1="56" x2="235" y2="56" stroke="#58a6ff" stroke-width="2"/>
  <line class="tl2" x1="235" y1="56" x2="370" y2="56" stroke="#58a6ff" stroke-width="2"/>
  <line class="tl3" x1="370" y1="56" x2="505" y2="56" stroke="#a371f7" stroke-width="2"/>
  <line class="tl4" x1="505" y1="56" x2="640" y2="56" stroke="#a371f7" stroke-width="2"/>
  <line class="tl5" x1="640" y1="56" x2="775" y2="56" stroke="#3fb950" stroke-width="2"/>

  <!-- Node 1: 2024 — KIET -->
  <g class="tn1">
    <circle cx="100" cy="56" r="7" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="100" cy="56" r="3" fill="#58a6ff"/>
  </g>

  <!-- Node 2: 2025 — VeriVolunte -->
  <g class="tn2">
    <circle cx="235" cy="56" r="7" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="235" cy="56" r="3" fill="#58a6ff"/>
  </g>

  <!-- Node 3: Jun 2026 — Quackathon + Drishti -->
  <g class="tn3">
    <circle cx="370" cy="56" r="9" fill="#0d1117" stroke="#e3b341" stroke-width="2"/>
    <circle cx="370" cy="56" r="4" fill="#e3b341"/>
    <text x="370" y="59" font-family="'Courier New',monospace" font-size="6"
          fill="#010409" text-anchor="middle">★</text>
  </g>

  <!-- Node 4: Aug 2026 — Language Metrics -->
  <g class="tn4">
    <circle cx="505" cy="56" r="7" fill="#0d1117" stroke="#a371f7" stroke-width="2"/>
    <circle cx="505" cy="56" r="3" fill="#a371f7"/>
  </g>

  <!-- Node 5: Sep 2026 — All projects -->
  <g class="tn5">
    <circle cx="640" cy="56" r="9" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <circle cx="640" cy="56" r="4" fill="#3fb950"/>
  </g>

  <!-- Node 6: NEXT — Open to roles -->
  <g class="tn6">
    <circle cx="775" cy="56" r="9" fill="#0d1117" stroke="#3fb950" stroke-width="2.5" class="gd"/>
    <circle cx="775" cy="56" r="4" fill="#3fb950"/>
  </g>

  <!-- Labels (fade in after all nodes) -->
  <g class="tlbl" font-family="'Courier New',monospace" text-anchor="middle">
    <text x="100" y="80" font-size="9" fill="#e6edf3" font-weight="bold">2024</text>
    <text x="100" y="92" font-size="8" fill="#6e7681">KIET CSE</text>

    <text x="235" y="80" font-size="9" fill="#e6edf3" font-weight="bold">2025</text>
    <text x="235" y="92" font-size="8" fill="#6e7681">First ship</text>

    <text x="370" y="80" font-size="9" fill="#e3b341" font-weight="bold">Jun '26</text>
    <text x="370" y="92" font-size="8" fill="#6e7681">Quackathon ★</text>
    <text x="370" y="102" font-size="8" fill="#6e7681">+ Drishti</text>

    <text x="505" y="80" font-size="9" fill="#e6edf3" font-weight="bold">Aug '26</text>
    <text x="505" y="92" font-size="8" fill="#6e7681">Lang Metrics</text>
    <text x="505" y="102" font-size="8" fill="#6e7681">production</text>

    <text x="640" y="80" font-size="9" fill="#e6edf3" font-weight="bold">Sep '26</text>
    <text x="640" y="92" font-size="8" fill="#6e7681">5 repos</text>
    <text x="640" y="102" font-size="8" fill="#6e7681">shipped</text>

    <text x="775" y="80" font-size="9" fill="#3fb950" font-weight="bold">NEXT</text>
    <text x="775" y="92" font-size="8" fill="#3fb950">Your team?</text>
    <text x="775" y="102" font-size="8" fill="#3fb950">Hire me →</text>
  </g>

  <!-- Arrow at end -->
  <polygon class="tlbl" points="810,56 800,50 800,62" fill="#3fb950" opacity="0.5"/>
</svg>
