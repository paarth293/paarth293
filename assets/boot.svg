<svg width="900" height="450" viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes fadeIn { from{opacity:0} to{opacity:1} }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes glitch1 {
        0%,95%,100%{transform:translate(0,0)}
        96%{transform:translate(-3px,0)}
        97%{transform:translate(3px,-1px)}
        98%{transform:translate(-1px,2px)}
        99%{transform:translate(2px,0)}
      }
      @keyframes scanline {
        0%{transform:translateY(-450px)} 100%{transform:translateY(450px)}
      }
      @keyframes memCount {
        0%{opacity:1}10%{opacity:1}100%{opacity:1}
      }
      @keyframes checkMark {
        0%,90%{fill:#3fb950;opacity:0}
        100%{fill:#3fb950;opacity:1}
      }
      @keyframes powerGlow {
        0%,100%{filter:drop-shadow(0 0 2px #3fb950)}
        50%{filter:drop-shadow(0 0 8px #3fb950) drop-shadow(0 0 16px #3fb95060)}
      }
      @keyframes nameReveal {
        0%{opacity:0;letter-spacing:20px;filter:blur(8px)}
        60%{opacity:1;letter-spacing:8px;filter:blur(2px)}
        100%{opacity:1;letter-spacing:3px;filter:blur(0px)}
      }
      @keyframes underlineGrow {
        from{stroke-dashoffset:560} to{stroke-dashoffset:0}
      }
      @keyframes roleType {
        0%{opacity:0} 100%{opacity:1}
      }
      @keyframes dotPulse1 { 0%,100%{opacity:0.2} 33%{opacity:1} }
      @keyframes dotPulse2 { 0%,100%{opacity:0.2} 66%{opacity:1} }
      @keyframes dotPulse3 { 0%,100%{opacity:0.2} 99%{opacity:1} }
      @keyframes borderTrace {
        from{stroke-dashoffset:2700} to{stroke-dashoffset:0}
      }
      @keyframes flicker {
        0%,100%{opacity:0.92} 10%{opacity:1} 20%{opacity:0.88} 30%{opacity:1}
        40%{opacity:0.95} 50%{opacity:1} 60%{opacity:0.9} 70%{opacity:1}
      }

      .l1  { animation: fadeIn 0.1s ease-out 0.2s both }
      .l2  { animation: fadeIn 0.1s ease-out 0.5s both }
      .l3  { animation: fadeIn 0.1s ease-out 0.8s both }
      .l4  { animation: fadeIn 0.1s ease-out 1.1s both }
      .l5  { animation: fadeIn 0.1s ease-out 1.3s both }
      .l6  { animation: fadeIn 0.1s ease-out 1.5s both }
      .l7  { animation: fadeIn 0.1s ease-out 1.7s both }
      .l8  { animation: fadeIn 0.1s ease-out 1.9s both }
      .l9  { animation: fadeIn 0.1s ease-out 2.1s both }
      .l10 { animation: fadeIn 0.1s ease-out 2.3s both }
      .l11 { animation: fadeIn 0.1s ease-out 2.5s both }
      .l12 { animation: fadeIn 0.1s ease-out 2.7s both }
      .l13 { animation: fadeIn 0.1s ease-out 2.9s both }
      .l14 { animation: fadeIn 0.1s ease-out 3.1s both }
      .l15 { animation: fadeIn 0.1s ease-out 3.3s both }
      .l16 { animation: fadeIn 0.3s ease-out 3.6s both }
      .l17 { animation: fadeIn 0.1s ease-out 3.8s both }
      .chk1 { animation: checkMark 0.1s ease-out 1.3s both }
      .chk2 { animation: checkMark 0.1s ease-out 1.7s both }
      .chk3 { animation: checkMark 0.1s ease-out 2.1s both }
      .chk4 { animation: checkMark 0.1s ease-out 2.5s both }
      .chk5 { animation: checkMark 0.1s ease-out 2.9s both }
      .chk6 { animation: checkMark 0.1s ease-out 3.3s both }
      .cursor { animation: blink 1.1s step-end infinite }
      .scan { animation: scanline 4s linear infinite; opacity:0.03 }
      .main-name { animation: nameReveal 1.2s cubic-bezier(.23,1,.32,1) 3.6s both }
      .main-line { animation: underlineGrow 0.8s ease-out 4.2s both; stroke-dasharray:560; }
      .role-txt { animation: roleType 0.5s ease-out 4.5s both }
      .d1 { animation: dotPulse1 1.5s ease-in-out infinite }
      .d2 { animation: dotPulse2 1.5s ease-in-out infinite }
      .d3 { animation: dotPulse3 1.5s ease-in-out infinite }
      .border-anim { animation: borderTrace 3s ease-out 0.1s both; stroke-dasharray:2700; }
      .glitch { animation: glitch1 8s linear infinite }
      .pg { animation: powerGlow 3s ease-in-out infinite }
      .flick { animation: flicker 6s linear infinite }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="450" fill="#010409"/>

  <!-- CRT scanline overlay -->
  <rect class="scan" width="900" height="3" y="-3" fill="#58a6ff"/>

  <!-- Outer border trace animation -->
  <rect class="border-anim" x="2" y="2" width="896" height="446" rx="6"
        fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Phosphor grid dots (CRT pixel effect) -->
  <g opacity="0.025" fill="#58a6ff">
    <line x1="0" y1="80" x2="900" y2="80" stroke="#21262d" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="900" y2="160" stroke="#21262d" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="900" y2="240" stroke="#21262d" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="900" y2="320" stroke="#21262d" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="900" y2="400" stroke="#21262d" stroke-width="0.5"/>
  </g>

  <!-- === POST BOOT SEQUENCE === -->

  <!-- Line 1: BIOS Header -->
  <g class="l1 flick" font-family="'Courier New',Courier,monospace">
    <text x="30" y="36" font-size="14" fill="#6e7681">PaarthOS BIOS v2.0.26 — System Initialization</text>
    <text x="750" y="36" font-size="11" fill="#30363d">2026-09-28</text>
  </g>

  <line class="l1" x1="30" y1="44" x2="870" y2="44" stroke="#21262d" stroke-width="1"/>

  <!-- Line 2: CPU detect -->
  <g class="l2" font-family="'Courier New',Courier,monospace" font-size="13">
    <text x="30" y="66" fill="#8b949e">Detecting processor</text>
    <text x="220" y="66" fill="#6e7681">........................</text>
    <text x="500" y="66" fill="#e6edf3">B.Tech CSE @ KIET Ghaziabad</text>
    <text x="820" y="66" fill="#3fb950">[OK]</text>
  </g>

  <!-- Line 3: Memory test -->
  <g class="l3" font-family="'Courier New',Courier,monospace" font-size="13">
    <text x="30" y="86" fill="#8b949e">Memory test</text>
    <text x="150" y="86" fill="#6e7681">..............................</text>
    <text x="500" y="86" fill="#e6edf3">CGPA 8.57 / 10.0 — 85.7% utilized</text>
    <text x="820" y="86" fill="#3fb950">[OK]</text>
  </g>

  <!-- Line 4: DSA coprocessor -->
  <g class="l4" font-family="'Courier New',Courier,monospace" font-size="13">
    <text x="30" y="106" fill="#8b949e">DSA coprocessor</text>
    <text x="190" y="106" fill="#6e7681">..........................</text>
    <text x="500" y="106" fill="#e3b341">LeetCode rated 1400+ (Java)</text>
    <text x="820" y="106" fill="#3fb950">[OK]</text>
  </g>

  <line class="l4" x1="30" y1="118" x2="870" y2="118" stroke="#21262d" stroke-width="1"/>

  <!-- Line 5: Loading kernel modules header -->
  <g class="l5" font-family="'Courier New',Courier,monospace" font-size="12">
    <text x="30" y="138" fill="#58a6ff">▸ Loading kernel modules...</text>
  </g>

  <!-- Module 1: MandateOS -->
  <g class="l6" font-family="'Courier New',Courier,monospace" font-size="13">
    <text x="50" y="160" fill="#8b949e">[  </text>
    <text x="70" y="160" fill="#3fb950" class="chk1">✓</text>
    <text x="84" y="160" fill="#8b949e">]</text>
    <text x="100" y="160" fill="#e6edf3" font-weight="bold">mod://MandateOS</text>
    <text x="310" y="160" fill="#6e7681">— agentic OS layer, task decomposition</text>
    <text x="720" y="160" fill="#a371f7">Python</text>
  </g>

  <!-- Module 2: ClauseGuard -->
  <g class="l7" font-family="'Courier New',Courier,monospace" font-size="13">
    <text x="50" y="182" fill="#8b949e">[  </text>
    <text x="70" y="182" fill="#3fb950" class="chk2">✓</text>
    <text x="84" y="182" fill="#8b949e">]</text>
    <text x="100" y="182" fill="#e6edf3" font-weight="bold">mod://ClauseGuard</text>
    <text x="310" y="182" fill="#6e7681">— legal AI, clause analysis</text>
    <text x="720" y="182" fill="#f78166">LIVE ✦</text>
  </g>

  <!-- Module 3: TrueBrain -->
  <g class="l8" font-family="'Courier New',Courier,monospace" font-size="13">
    <text x="50" y="204" fill="#8b949e">[  </text>
    <text x="70" y="204" fill="#3fb950" class="chk3">✓</text>
    <text x="84" y="204" fill="#8b949e">]</text>
    <text x="100" y="204" fill="#e6edf3" font-weight="bold">mod://TrueBrain</text>
    <text x="310" y="204" fill="#6e7681">— long-term memory engine for agents</text>
    <text x="720" y="204" fill="#a371f7">Python</text>
  </g>

  <!-- Module 4: Knowledge-Agent -->
  <g class="l9" font-family="'Courier New',Courier,monospace" font-size="13">
    <text x="50" y="226" fill="#8b949e">[  </text>
    <text x="70" y="226" fill="#3fb950" class="chk4">✓</text>
    <text x="84" y="226" fill="#8b949e">]</text>
    <text x="100" y="226" fill="#e6edf3" font-weight="bold">mod://Knowledge-Agent</text>
    <text x="310" y="226" fill="#6e7681">— local RAG, zero data egress</text>
    <text x="720" y="226" fill="#a371f7">Python</text>
  </g>

  <!-- Module 5: PromptForge -->
  <g class="l10" font-family="'Courier New',Courier,monospace" font-size="13">
    <text x="50" y="248" fill="#8b949e">[  </text>
    <text x="70" y="248" fill="#3fb950" class="chk5">✓</text>
    <text x="84" y="248" fill="#8b949e">]</text>
    <text x="100" y="248" fill="#e6edf3" font-weight="bold">mod://PromptForge</text>
    <text x="310" y="248" fill="#6e7681">— 14-stage tool schema pipeline</text>
    <text x="720" y="248" fill="#e3b341">MIT</text>
  </g>

  <!-- Module 6: Drishti -->
  <g class="l11" font-family="'Courier New',Courier,monospace" font-size="13">
    <text x="50" y="270" fill="#8b949e">[  </text>
    <text x="70" y="270" fill="#3fb950" class="chk6">✓</text>
    <text x="84" y="270" fill="#8b949e">]</text>
    <text x="100" y="270" fill="#e6edf3" font-weight="bold">mod://Drishti</text>
    <text x="310" y="270" fill="#6e7681">— air-gapped AI for refineries</text>
    <text x="720" y="270" fill="#f78166">SIH 2026</text>
  </g>

  <line class="l11" x1="30" y1="282" x2="870" y2="282" stroke="#21262d" stroke-width="1"/>

  <!-- Achievements loaded -->
  <g class="l12" font-family="'Courier New',Courier,monospace" font-size="12">
    <text x="30" y="302" fill="#58a6ff">▸ Loading achievement cache...</text>
  </g>
  <g class="l13" font-family="'Courier New',Courier,monospace" font-size="12">
    <text x="50" y="322" fill="#e3b341">★ Quackathon 2026 — Track Winner (team lead)</text>
  </g>
  <g class="l14" font-family="'Courier New',Courier,monospace" font-size="12">
    <text x="50" y="342" fill="#e3b341">★ Smart India Hackathon 2026 — Drishti (air-gapped AI)</text>
  </g>
  <g class="l15" font-family="'Courier New',Courier,monospace" font-size="12">
    <text x="50" y="362" fill="#e3b341">★ Language Metrics — production SaaS, real users, real revenue</text>
  </g>

  <line class="l15" x1="30" y1="374" x2="870" y2="374" stroke="#21262d" stroke-width="1"/>

  <!-- BIG NAME REVEAL -->
  <text class="main-name glitch" x="450" y="410" font-family="'Courier New',Courier,monospace"
        font-size="36" font-weight="bold" fill="#e6edf3" text-anchor="middle"
        letter-spacing="3">PAARTH GUPTA</text>

  <!-- Glowing underline -->
  <line class="main-line pg" x1="170" y1="418" x2="730" y2="418"
        stroke="#58a6ff" stroke-width="2"/>

  <!-- Role line -->
  <text class="role-txt" x="450" y="442" font-family="'Courier New',Courier,monospace"
        font-size="14" fill="#58a6ff" text-anchor="middle">
    Full-Stack  ·  AI Systems  ·  3D Web  ·  Open for internships
  </text>

  <!-- Blinking cursor at very end -->
  <g class="l17" font-family="'Courier New',Courier,monospace" font-size="13">
    <text x="30" y="448" fill="#3fb950">▶ root@paarthos:~$</text>
    <text x="220" y="448" fill="#e6edf3" class="cursor">█</text>
  </g>

  <!-- Loading dots top-right -->
  <g class="l1" font-family="monospace" font-size="14">
    <text x="846" y="36" fill="#3fb950" class="d1">·</text>
    <text x="858" y="36" fill="#3fb950" class="d2">·</text>
    <text x="870" y="36" fill="#3fb950" class="d3">·</text>
  </g>
</svg>
