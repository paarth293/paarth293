<svg viewBox="0 0 1200 300" width="1200" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Paarth Gupta — Full-Stack Engineer, AI &amp; Agentic Systems" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#2438E8" stop-opacity="0"/>
  <stop offset="50%" stop-color="#2438E8" stop-opacity="0.35"/>
  <stop offset="100%" stop-color="#2438E8" stop-opacity="0"/>
</linearGradient>
<style>
  text { font-family: ui-monospace,'Cascadia Mono','Segoe UI Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace; }
  .disp { font-family: 'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif; }
  .letter { opacity: 1; animation: flicker-in 0.5s ease-out both; }
  .beacon { opacity: 1; animation: beacon-in 0.4s ease-out both; }
  .tagline { animation: cycle 12s ease-in-out infinite; }
  .tagline.t0 { animation-delay: 0s; }
  .tagline.t1 { animation-delay: 4s; }
  .tagline.t2 { animation-delay: 8s; }
  .cursor { opacity: 1; animation: blink 1s steps(1) infinite; }
  .scan { animation: sweep 5s linear infinite; }

  @keyframes flicker-in {
    0%   { opacity: 0; transform: translateX(var(--dx, 8px)); }
    60%  { opacity: 1; transform: translateX(calc(var(--dx, 8px) * -0.2)); }
    100% { opacity: 1; transform: translateX(0); }
  }
  @keyframes beacon-in {
    0%   { opacity: 0; transform: scaleY(0.2); }
    100% { opacity: 1; transform: scaleY(1); }
  }
  @keyframes cycle {
    0%   { opacity: 0; }
    4%   { opacity: 1; }
    30%  { opacity: 1; }
    36%  { opacity: 0; }
    100% { opacity: 0; }
  }
  @keyframes blink {
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  @keyframes sweep {
    0%   { transform: translateY(-46px); }
    100% { transform: translateY(346px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .letter, .beacon, .tagline, .cursor, .scan { animation: none !important; }
  }
</style></defs>

<rect width="1200" height="300" fill="#F3F1EA"/>
<clipPath id="heroClip"><rect width="1200" height="300"/></clipPath>
<g clip-path="url(#heroClip)"><rect x="0" y="0" width="1200" height="46" fill="url(#scanGrad)" class="scan" opacity="0.5"/></g>
<rect x="0" y="0" width="1200" height="300" fill="none" stroke="#161614" stroke-opacity="0.15" stroke-width="1"/>
<text x="60" y="150" class="disp letter" font-size="64" font-weight="800" fill="#161614" opacity="1" style="animation-delay:0.150s; --dx:-10px;">P</text><text x="102.24000000000001" y="150" class="disp letter" font-size="64" font-weight="800" fill="#161614" opacity="1" style="animation-delay:0.195s; --dx:10px;">A</text><text x="144.48000000000002" y="150" class="disp letter" font-size="64" font-weight="800" fill="#161614" opacity="1" style="animation-delay:0.240s; --dx:-10px;">A</text><text x="186.72000000000003" y="150" class="disp letter" font-size="64" font-weight="800" fill="#161614" opacity="1" style="animation-delay:0.285s; --dx:10px;">R</text><text x="228.96000000000004" y="150" class="disp letter" font-size="64" font-weight="800" fill="#161614" opacity="1" style="animation-delay:0.330s; --dx:-10px;">T</text><text x="271.20000000000005" y="150" class="disp letter" font-size="64" font-weight="800" fill="#161614" opacity="1" style="animation-delay:0.375s; --dx:10px;">H</text><text x="338.78400000000005" y="150" class="disp letter" font-size="64" font-weight="800" fill="#161614" opacity="1" style="animation-delay:0.465s; --dx:10px;">G</text><text x="381.02400000000006" y="150" class="disp letter" font-size="64" font-weight="800" fill="#161614" opacity="1" style="animation-delay:0.510s; --dx:-10px;">U</text><text x="423.26400000000007" y="150" class="disp letter" font-size="64" font-weight="800" fill="#161614" opacity="1" style="animation-delay:0.555s; --dx:10px;">P</text><text x="465.5040000000001" y="150" class="disp letter" font-size="64" font-weight="800" fill="#161614" opacity="1" style="animation-delay:0.600s; --dx:-10px;">T</text><text x="507.7440000000001" y="150" class="disp letter" font-size="64" font-weight="800" fill="#161614" opacity="1" style="animation-delay:0.645s; --dx:10px;">A</text>
<rect x="60" y="184" width="16" height="10" fill="#2438E8" class="beacon" style="animation-delay:0.90s"/><rect x="88" y="184" width="16" height="10" fill="#E0283F" class="beacon" style="animation-delay:1.02s"/><rect x="116" y="184" width="16" height="10" fill="#F5A300" class="beacon" style="animation-delay:1.14s"/>
<text x="112" y="216" font-size="15" font-weight="600" fill="#8A877E" opacity="1" class="tagline t0">FULL-STACK ENGINEER</text><text x="112" y="216" font-size="15" font-weight="600" fill="#8A877E" opacity="0" class="tagline t1">AI &amp; AGENTIC SYSTEMS</text><text x="112" y="216" font-size="15" font-weight="600" fill="#8A877E" opacity="0" class="tagline t2">MIND THE GAP.</text>
<rect x="322" y="203" width="9" height="16" fill="#8A877E" class="cursor"/>

<line x1="60" y1="266" x2="1140" y2="266" stroke="#8A877E" stroke-width="1" stroke-dasharray="1,4"/>
<text x="60" y="256" font-size="11" fill="#8A877E" letter-spacing="1">NOW BOARDING · INDEX CENTRAL · GHAZIABAD, INDIA</text>

</svg>