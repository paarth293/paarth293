<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes rowFade {
        from { opacity:0; transform:translateX(-12px) }
        to   { opacity:1; transform:translateX(0) }
      }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes statusPulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
      @keyframes borderAnim {
        0%,100% { stroke-opacity:0.25 }
        50%     { stroke-opacity:0.7  }
      }
      .r1 { animation: rowFade 0.5s ease-out 0.1s both }
      .r2 { animation: rowFade 0.5s ease-out 0.25s both }
      .r3 { animation: rowFade 0.5s ease-out 0.40s both }
      .r4 { animation: rowFade 0.5s ease-out 0.55s both }
      .r5 { animation: rowFade 0.5s ease-out 0.70s both }
      .r6 { animation: rowFade 0.5s ease-out 0.85s both }
      .cursor { animation: blink 1.1s step-end infinite }
      .sp { animation: statusPulse 2s ease-in-out infinite }
      .brd { animation: borderAnim 3s ease-in-out infinite }
    </style>
    <linearGradient id="hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" fill="#0d1117" rx="8"/>
  <!-- header bar -->
  <rect width="900" height="38" fill="url(#hdr)" rx="8"/>
  <rect y="30" width="900" height="8" fill="url(#hdr)"/>

  <!-- window buttons -->
  <circle cx="22" cy="19" r="6" fill="#f78166" opacity="0.8"/>
  <circle cx="42" cy="19" r="6" fill="#e3b341" opacity="0.8"/>
  <circle cx="62" cy="19" r="6" fill="#3fb950" opacity="0.8"/>

  <!-- title -->
  <text x="450" y="23" font-family="'Courier New',monospace" font-size="12" fill="#6e7681" text-anchor="middle">
    paarth293 — active_systems.sh
  </text>

  <!-- border -->
  <rect x="0.5" y="0.5" width="899" height="219" fill="none" stroke="#30363d" stroke-width="1" rx="8" class="brd"/>

  <!-- column headers -->
  <g font-family="'Courier New',monospace" font-size="11" fill="#6e7681">
    <text x="20"  y="62">ID</text>
    <text x="80"  y="62">NAME</text>
    <text x="290" y="62">STACK</text>
    <text x="530" y="62">STATUS</text>
    <text x="640" y="62">TYPE</text>
    <text x="760" y="62">LINK</text>
  </g>
  <line x1="14" y1="68" x2="886" y2="68" stroke="#21262d" stroke-width="1"/>

  <!-- Row 1: MandateOS -->
  <g class="r1" font-family="'Courier New',monospace" font-size="12">
    <text x="20"  y="90" fill="#6e7681">a3f9</text>
    <text x="80"  y="90" fill="#e6edf3" font-weight="bold">MandateOS</text>
    <text x="290" y="90" fill="#a371f7">Python · Agents</text>
    <circle cx="538" cy="86" r="4" fill="#3fb950" class="sp"/>
    <text x="548" y="90" fill="#3fb950">RUNNING</text>
    <text x="640" y="90" fill="#58a6ff">AI System</text>
    <text x="760" y="90" fill="#58a6ff" text-decoration="underline">→ github.com</text>
  </g>

  <!-- Row 2: ClauseGuard -->
  <g class="r2" font-family="'Courier New',monospace" font-size="12">
    <text x="20"  y="112" fill="#6e7681">7c82</text>
    <text x="80"  y="112" fill="#e6edf3" font-weight="bold">ClauseGuard</text>
    <text x="290" y="112" fill="#a371f7">Python · FastAPI</text>
    <circle cx="538" cy="108" r="4" fill="#3fb950" class="sp"/>
    <text x="548" y="112" fill="#3fb950">LIVE ✦</text>
    <text x="640" y="112" fill="#f78166">Legal AI</text>
    <text x="760" y="112" fill="#58a6ff" text-decoration="underline">→ vercel.app</text>
  </g>

  <!-- Row 3: TrueBrain -->
  <g class="r3" font-family="'Courier New',monospace" font-size="12">
    <text x="20"  y="134" fill="#6e7681">b19e</text>
    <text x="80"  y="134" fill="#e6edf3" font-weight="bold">TrueBrain</text>
    <text x="290" y="134" fill="#a371f7">Python · Memory</text>
    <circle cx="538" cy="130" r="4" fill="#3fb950" class="sp"/>
    <text x="548" y="134" fill="#3fb950">RUNNING</text>
    <text x="640" y="134" fill="#58a6ff">AI Engine</text>
    <text x="760" y="134" fill="#58a6ff" text-decoration="underline">→ github.com</text>
  </g>

  <!-- Row 4: Knowledge-Agent -->
  <g class="r4" font-family="'Courier New',monospace" font-size="12">
    <text x="20"  y="156" fill="#6e7681">e55a</text>
    <text x="80"  y="156" fill="#e6edf3" font-weight="bold">Knowledge-Agent</text>
    <text x="290" y="156" fill="#a371f7">Python · RAG</text>
    <circle cx="538" cy="152" r="4" fill="#3fb950" class="sp"/>
    <text x="548" y="156" fill="#3fb950">RUNNING</text>
    <text x="640" y="156" fill="#58a6ff">RAG System</text>
    <text x="760" y="156" fill="#58a6ff" text-decoration="underline">→ github.com</text>
  </g>

  <!-- Row 5: PromptForge -->
  <g class="r5" font-family="'Courier New',monospace" font-size="12">
    <text x="20"  y="178" fill="#6e7681">f2c1</text>
    <text x="80"  y="178" fill="#e6edf3" font-weight="bold">PromptForge</text>
    <text x="290" y="178" fill="#a371f7">Python · Pipeline</text>
    <circle cx="538" cy="174" r="4" fill="#e3b341" class="sp"/>
    <text x="548" y="178" fill="#e3b341">BUILDING</text>
    <text x="640" y="178" fill="#58a6ff">Dev Tool</text>
    <text x="760" y="178" fill="#58a6ff" text-decoration="underline">→ github.com</text>
  </g>

  <!-- Row 6: Drishti -->
  <g class="r6" font-family="'Courier New',monospace" font-size="12">
    <text x="20"  y="200" fill="#6e7681">d8f4</text>
    <text x="80"  y="200" fill="#e6edf3" font-weight="bold">Drishti</text>
    <text x="290" y="200" fill="#a371f7">React · FastAPI</text>
    <circle cx="538" cy="196" r="4" fill="#3fb950" class="sp"/>
    <text x="548" y="200" fill="#3fb950">DEPLOYED</text>
    <text x="640" y="200" fill="#f78166">Hackathon</text>
    <text x="760" y="200" fill="#58a6ff" text-decoration="underline">→ github.com</text>
  </g>
</svg>
