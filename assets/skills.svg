<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes barGrow1 { from{width:0} to{width:88%} }
      @keyframes barGrow2 { from{width:0} to{width:82%} }
      @keyframes barGrow3 { from{width:0} to{width:75%} }
      @keyframes barGrow4 { from{width:0} to{width:70%} }
      @keyframes barGrow5 { from{width:0} to{width:92%} }
      @keyframes barGrow6 { from{width:0} to{width:65%} }
      @keyframes fadeIn { from{opacity:0} to{opacity:1} }
      @keyframes shimmer {
        0%   { stop-color:#58a6ff }
        50%  { stop-color:#a371f7 }
        100% { stop-color:#58a6ff }
      }
      .bar1 { animation: barGrow1 1.4s cubic-bezier(.4,0,.2,1) 0.2s both }
      .bar2 { animation: barGrow2 1.4s cubic-bezier(.4,0,.2,1) 0.4s both }
      .bar3 { animation: barGrow3 1.4s cubic-bezier(.4,0,.2,1) 0.6s both }
      .bar4 { animation: barGrow4 1.4s cubic-bezier(.4,0,.2,1) 0.8s both }
      .bar5 { animation: barGrow5 1.4s cubic-bezier(.4,0,.2,1) 1.0s both }
      .bar6 { animation: barGrow6 1.4s cubic-bezier(.4,0,.2,1) 1.2s both }
      .labels { animation: fadeIn 0.5s ease-out 0.1s both }
    </style>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f78166"/>
      <stop offset="100%" stop-color="#e3b341"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="g6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e3b341"/>
      <stop offset="100%" stop-color="#f78166"/>
    </linearGradient>
  </defs>

  <rect width="900" height="180" fill="#0d1117" rx="8"/>
  <rect x="0.5" y="0.5" width="899" height="179" fill="none" stroke="#21262d" stroke-width="1" rx="8"/>

  <!-- title -->
  <text x="20" y="28" font-family="'Courier New',monospace" font-size="11" fill="#6e7681">$ cat neural_pathways.cfg</text>
  <line x1="14" y1="36" x2="886" y2="36" stroke="#21262d" stroke-width="1"/>

  <!-- skill rows — label | bar | percent -->
  <!-- clip regions for bar growth -->
  <clipPath id="c1"><rect x="200" y="52"  width="600" height="16" rx="4"/></clipPath>
  <clipPath id="c2"><rect x="200" y="80"  width="600" height="16" rx="4"/></clipPath>
  <clipPath id="c3"><rect x="200" y="108" width="600" height="16" rx="4"/></clipPath>
  <clipPath id="c4"><rect x="200" y="52"  width="600" height="16" rx="4" transform="translate(450,0)"/></clipPath>

  <!-- Python -->
  <text x="20" y="65" font-family="'Courier New',monospace" font-size="13" fill="#e6edf3">Python</text>
  <rect x="200" y="52" width="600" height="16" rx="4" fill="#161b22"/>
  <rect x="200" y="52" width="0" height="16" rx="4" fill="url(#g1)" class="bar1"/>
  <text x="820" y="65" font-family="'Courier New',monospace" font-size="12" fill="#6e7681">88%</text>

  <!-- JavaScript / TS -->
  <text x="20" y="93" font-family="'Courier New',monospace" font-size="13" fill="#e6edf3">JS / TS</text>
  <rect x="200" y="80" width="600" height="16" rx="4" fill="#161b22"/>
  <rect x="200" y="80" width="0" height="16" rx="4" fill="url(#g2)" class="bar2"/>
  <text x="820" y="93" font-family="'Courier New',monospace" font-size="12" fill="#6e7681">82%</text>

  <!-- React / Next.js -->
  <text x="20" y="121" font-family="'Courier New',monospace" font-size="13" fill="#e6edf3">React / Next</text>
  <rect x="200" y="108" width="600" height="16" rx="4" fill="#161b22"/>
  <rect x="200" y="108" width="0" height="16" rx="4" fill="url(#g3)" class="bar3"/>
  <text x="820" y="121" font-family="'Courier New',monospace" font-size="12" fill="#6e7681">75%</text>

  <!-- AI / Agents -->
  <text x="20" y="149" font-family="'Courier New',monospace" font-size="13" fill="#e6edf3">AI / Agents</text>
  <rect x="200" y="136" width="600" height="16" rx="4" fill="#161b22"/>
  <rect x="200" y="136" width="0" height="16" rx="4" fill="url(#g4)" class="bar4"/>
  <text x="820" y="149" font-family="'Courier New',monospace" font-size="12" fill="#6e7681">70%</text>

  <!-- Node.js / APIs -->
  <text x="20" y="168" font-family="'Courier New',monospace" font-size="13" fill="#e6edf3">Node / APIs</text>
  <rect x="200" y="155" width="600" height="16" rx="4" fill="#161b22"/>
  <rect x="200" y="155" width="0" height="16" rx="4" fill="url(#g5)" class="bar5"/>
  <text x="820" y="168" font-family="'Courier New',monospace" font-size="12" fill="#6e7681">92%</text>
</svg>
