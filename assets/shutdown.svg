<svg width="900" height="80" viewBox="0 0 900 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes shutdownFade {
        0%{opacity:1} 80%{opacity:1} 100%{opacity:0.4}
      }
      @keyframes blinkSlow { 0%,49%{opacity:0.7} 50%,100%{opacity:0.2} }
      @keyframes powerOff {
        0%,100%{filter:drop-shadow(0 0 3px #f78166)}
        50%{filter:drop-shadow(0 0 8px #f78166) drop-shadow(0 0 14px #f7816660)}
      }
      .sd { animation: shutdownFade 4s ease-out infinite }
      .bslow { animation: blinkSlow 2s step-end infinite }
      .poff { animation: powerOff 3s ease-in-out infinite }
    </style>
  </defs>

  <rect width="900" height="80" fill="#010409" rx="6"/>
  <rect x="1" y="1" width="898" height="78" fill="none" stroke="#21262d" stroke-width="1" rx="6"/>

  <!-- Shutdown prompt -->
  <g font-family="'Courier New',monospace" class="sd">
    <text x="30" y="30" font-size="12" fill="#6e7681">
      <tspan fill="#f78166">▶</tspan>
      <tspan fill="#6e7681"> root@paarthos:~$ </tspan>
      <tspan fill="#e6edf3">shutdown</tspan>
      <tspan fill="#f78166"> --schedule=</tspan>
      <tspan fill="#3fb950">"after you hire me"</tspan>
    </text>
    <text x="30" y="52" font-size="11" fill="#6e7681">
      System will remain online until then. Accepting connections on port
      <tspan fill="#58a6ff">i.m.paarthgupta@gmail.com</tspan>
    </text>
    <text x="30" y="70" font-size="11" fill="#30363d">
      PaarthOS v2.0 — 6 modules loaded — all systems nominal
    </text>
  </g>

  <!-- Power indicator -->
  <circle cx="870" cy="40" r="5" fill="#3fb950" class="poff" opacity="0.7"/>
</svg>
