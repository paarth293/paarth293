<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes nodeAppear {
        from { transform:scale(0); opacity:0 }
        to   { transform:scale(1); opacity:1 }
      }
      @keyframes pathDraw {
        from { stroke-dashoffset:400 }
        to   { stroke-dashoffset:0 }
      }
      @keyframes pulse {
        0%,100% { r:6; opacity:0.8 }
        50%     { r:10; opacity:1 }
      }
      @keyframes dataFlow {
        0%   { offset-distance:0%;   opacity:0 }
        10%  { opacity:1 }
        90%  { opacity:1 }
        100% { offset-distance:100%; opacity:0 }
      }
      @keyframes ringPulse {
        0%,100% { r:18; stroke-opacity:0.3 }
        50%     { r:24; stroke-opacity:0.6 }
      }
      @keyframes hoverGlow {
        0%,100% { filter:drop-shadow(0 0 3px var(--c,#58a6ff)) }
        50%     { filter:drop-shadow(0 0 10px var(--c,#58a6ff)) drop-shadow(0 0 20px var(--c,#58a6ff)) }
      }
      @keyframes labelFade { from{opacity:0} to{opacity:1} }
      @keyframes centerPulse {
        0%,100% { r:30; fill-opacity:0.08 }
        50%     { r:40; fill-opacity:0.15 }
      }
      @keyframes orbitSpin {
        from { transform:rotate(0deg) }
        to   { transform:rotate(360deg) }
      }

      .n1 { animation: nodeAppear 0.4s cubic-bezier(.34,1.56,.64,1) 0.5s both; transform-origin:450px 200px }
      .n2 { animation: nodeAppear 0.4s cubic-bezier(.34,1.56,.64,1) 0.8s both; transform-origin:225px 75px }
      .n3 { animation: nodeAppear 0.4s cubic-bezier(.34,1.56,.64,1) 1.0s both; transform-origin:675px 75px }
      .n4 { animation: nodeAppear 0.4s cubic-bezier(.34,1.56,.64,1) 1.2s both; transform-origin:140px 240px }
      .n5 { animation: nodeAppear 0.4s cubic-bezier(.34,1.56,.64,1) 1.4s both; transform-origin:760px 240px }
      .n6 { animation: nodeAppear 0.4s cubic-bezier(.34,1.56,.64,1) 1.6s both; transform-origin:300px 350px }
      .n7 { animation: nodeAppear 0.4s cubic-bezier(.34,1.56,.64,1) 1.8s both; transform-origin:600px 350px }

      .p1 { animation: pathDraw 1s ease-out 2.0s both; stroke-dasharray:400 }
      .p2 { animation: pathDraw 1s ease-out 2.2s both; stroke-dasharray:400 }
      .p3 { animation: pathDraw 1s ease-out 2.4s both; stroke-dasharray:400 }
      .p4 { animation: pathDraw 1s ease-out 2.6s both; stroke-dasharray:400 }
      .p5 { animation: pathDraw 1s ease-out 2.8s both; stroke-dasharray:400 }
      .p6 { animation: pathDraw 1s ease-out 3.0s both; stroke-dasharray:400 }
      .p7 { animation: pathDraw 1s ease-out 3.1s both; stroke-dasharray:400 }
      .p8 { animation: pathDraw 1s ease-out 3.2s both; stroke-dasharray:400 }

      .lbl { animation: labelFade 0.3s ease-out 3.4s both }
      .cp  { animation: centerPulse 3s ease-in-out infinite }
      .rp  { animation: ringPulse 2.5s ease-in-out infinite }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="400" fill="#010409"/>
  <rect x="1" y="1" width="898" height="398" fill="none" stroke="#21262d" stroke-width="1" rx="6"/>

  <!-- Title -->
  <text x="30" y="28" font-family="'Courier New',monospace" font-size="11" fill="#6e7681">
    $ netstat --topology --show-links
  </text>
  <line x1="20" y1="36" x2="880" y2="36" stroke="#21262d" stroke-width="1"/>

  <!-- === CONNECTION LINES (drawn animated) === -->

  <!-- Center hub to each node -->
  <line class="p1" x1="450" y1="195" x2="225" y2="80"  stroke="#58a6ff" stroke-width="1.5" opacity="0.4"/>
  <line class="p2" x1="450" y1="195" x2="675" y2="80"  stroke="#58a6ff" stroke-width="1.5" opacity="0.4"/>
  <line class="p3" x1="450" y1="200" x2="140" y2="235" stroke="#a371f7" stroke-width="1.5" opacity="0.4"/>
  <line class="p4" x1="450" y1="200" x2="760" y2="235" stroke="#a371f7" stroke-width="1.5" opacity="0.4"/>
  <line class="p5" x1="450" y1="210" x2="300" y2="345" stroke="#3fb950" stroke-width="1.5" opacity="0.4"/>
  <line class="p6" x1="450" y1="210" x2="600" y2="345" stroke="#3fb950" stroke-width="1.5" opacity="0.4"/>

  <!-- Cross-connections between related projects -->
  <line class="p7" x1="140" y1="240" x2="300" y2="345" stroke="#f7816640" stroke-width="1" opacity="0.3" stroke-dasharray="6,4"/>
  <line class="p8" x1="225" y1="80"  x2="675" y2="80"  stroke="#f7816640" stroke-width="1" opacity="0.3" stroke-dasharray="6,4"/>

  <!-- === CENTER HUB: Paarth === -->
  <g class="n1">
    <circle cx="450" cy="200" r="30" fill="#58a6ff" opacity="0.08" class="cp"/>
    <circle cx="450" cy="200" r="18" stroke="#58a6ff" stroke-width="1.5" fill="none" class="rp"/>
    <circle cx="450" cy="200" r="8"  fill="#58a6ff" filter="url(#glow)"/>
    <text x="450" y="204" font-family="'Courier New',monospace" font-size="7"
          fill="#010409" text-anchor="middle" font-weight="bold">P</text>
  </g>

  <!-- === NODE: MandateOS (top-left) === -->
  <g class="n2">
    <circle cx="225" cy="75" r="22" fill="#0d1117" stroke="#a371f7" stroke-width="2"/>
    <circle cx="225" cy="75" r="6"  fill="#a371f7" filter="url(#glow)"/>
    <text x="225" y="79" font-family="'Courier New',monospace" font-size="8"
          fill="#010409" text-anchor="middle" font-weight="bold">M</text>
  </g>
  <g class="lbl" font-family="'Courier New',monospace">
    <text x="225" y="110" font-size="11" fill="#e6edf3" text-anchor="middle" font-weight="bold">MandateOS</text>
    <text x="225" y="124" font-size="9" fill="#8b949e" text-anchor="middle">Agentic OS Layer</text>
    <circle cx="186" cy="120" r="3" fill="#3fb950"/>
  </g>

  <!-- === NODE: ClauseGuard (top-right) === -->
  <g class="n3">
    <circle cx="675" cy="75" r="22" fill="#0d1117" stroke="#f78166" stroke-width="2"/>
    <circle cx="675" cy="75" r="6"  fill="#f78166" filter="url(#glow)"/>
    <text x="675" y="79" font-family="'Courier New',monospace" font-size="8"
          fill="#010409" text-anchor="middle" font-weight="bold">C</text>
  </g>
  <g class="lbl" font-family="'Courier New',monospace">
    <text x="675" y="110" font-size="11" fill="#e6edf3" text-anchor="middle" font-weight="bold">ClauseGuard</text>
    <text x="675" y="124" font-size="9" fill="#8b949e" text-anchor="middle">Legal AI — LIVE</text>
    <circle cx="628" cy="120" r="3" fill="#3fb950"/>
    <text x="730" y="124" font-size="8" fill="#f78166">✦ DEPLOYED</text>
  </g>

  <!-- === NODE: TrueBrain (mid-left) === -->
  <g class="n4">
    <circle cx="140" cy="235" r="22" fill="#0d1117" stroke="#a371f7" stroke-width="2"/>
    <circle cx="140" cy="235" r="6"  fill="#a371f7" filter="url(#glow)"/>
    <text x="140" y="239" font-family="'Courier New',monospace" font-size="8"
          fill="#010409" text-anchor="middle" font-weight="bold">T</text>
  </g>
  <g class="lbl" font-family="'Courier New',monospace">
    <text x="140" y="270" font-size="11" fill="#e6edf3" text-anchor="middle" font-weight="bold">TrueBrain</text>
    <text x="140" y="284" font-size="9" fill="#8b949e" text-anchor="middle">Memory Engine</text>
    <circle cx="104" cy="280" r="3" fill="#3fb950"/>
  </g>

  <!-- === NODE: Knowledge-Agent (mid-right) === -->
  <g class="n5">
    <circle cx="760" cy="235" r="22" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="760" cy="235" r="6"  fill="#58a6ff" filter="url(#glow)"/>
    <text x="760" y="239" font-family="'Courier New',monospace" font-size="8"
          fill="#010409" text-anchor="middle" font-weight="bold">K</text>
  </g>
  <g class="lbl" font-family="'Courier New',monospace">
    <text x="760" y="270" font-size="11" fill="#e6edf3" text-anchor="middle" font-weight="bold">Knowledge-Agent</text>
    <text x="760" y="284" font-size="9" fill="#8b949e" text-anchor="middle">Local RAG System</text>
    <circle cx="708" cy="280" r="3" fill="#3fb950"/>
  </g>

  <!-- === NODE: PromptForge (bottom-left) === -->
  <g class="n6">
    <circle cx="300" cy="345" r="22" fill="#0d1117" stroke="#e3b341" stroke-width="2"/>
    <circle cx="300" cy="345" r="6"  fill="#e3b341" filter="url(#glow)"/>
    <text x="300" y="349" font-family="'Courier New',monospace" font-size="8"
          fill="#010409" text-anchor="middle" font-weight="bold">P</text>
  </g>
  <g class="lbl" font-family="'Courier New',monospace">
    <text x="300" y="380" font-size="11" fill="#e6edf3" text-anchor="middle" font-weight="bold">PromptForge</text>
    <text x="300" y="393" font-size="9" fill="#8b949e" text-anchor="middle">Tool Schema Pipeline</text>
    <circle cx="258" cy="389" r="3" fill="#e3b341"/>
  </g>

  <!-- === NODE: Drishti (bottom-right) === -->
  <g class="n7">
    <circle cx="600" cy="345" r="22" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <circle cx="600" cy="345" r="6"  fill="#3fb950" filter="url(#glow)"/>
    <text x="600" y="349" font-family="'Courier New',monospace" font-size="8"
          fill="#010409" text-anchor="middle" font-weight="bold">D</text>
  </g>
  <g class="lbl" font-family="'Courier New',monospace">
    <text x="600" y="380" font-size="11" fill="#e6edf3" text-anchor="middle" font-weight="bold">Drishti</text>
    <text x="600" y="393" font-size="9" fill="#8b949e" text-anchor="middle">Air-gapped AI · SIH</text>
    <circle cx="560" cy="389" r="3" fill="#3fb950"/>
  </g>

  <!-- Legend -->
  <g class="lbl" font-family="'Courier New',monospace" font-size="9" fill="#6e7681">
    <text x="30" y="390">
      <tspan fill="#3fb950">●</tspan> running
      <tspan dx="10" fill="#e3b341">●</tspan> building
      <tspan dx="10" fill="#f78166">✦</tspan> deployed
      <tspan dx="10" fill="#21262d">┄</tspan> shared infra
    </text>
  </g>
</svg>
